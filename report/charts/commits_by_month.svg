<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1a2b4c">Development Velocity: Commits per Month</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#5a6b85">January 19 – April 9, 2026  •  111 total commits</text>

  <!-- Plot area: x 110-840, y 110-470 -->
  <line x1="110" y1="470" x2="840" y2="470" stroke="#1a2b4c" stroke-width="2"/>
  <line x1="110" y1="110" x2="110" y2="470" stroke="#1a2b4c" stroke-width="2"/>

  <!-- Y gridlines (max 50, step 10) -->
  <g stroke="#e3e8f0" stroke-width="1">
    <line x1="110" y1="398" x2="840" y2="398"/>
    <line x1="110" y1="326" x2="840" y2="326"/>
    <line x1="110" y1="254" x2="840" y2="254"/>
    <line x1="110" y1="182" x2="840" y2="182"/>
    <line x1="110" y1="110" x2="840" y2="110"/>
  </g>
  <g font-size="13" fill="#5a6b85" text-anchor="end">
    <text x="100" y="474">0</text>
    <text x="100" y="402">10</text>
    <text x="100" y="330">20</text>
    <text x="100" y="258">30</text>
    <text x="100" y="186">40</text>
    <text x="100" y="114">50</text>
  </g>

  <!-- Bars: scale 7.2 px per commit (50 = 360 px) -->
  <!-- Jan: 7 -> 50.4 -->
  <rect x="180" y="419.6" width="120" height="50.4" fill="#3b6fb6"/>
  <text x="240" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2b4c">7</text>
  <text x="240" y="498" text-anchor="middle" font-size="15" fill="#1a2b4c">January</text>

  <!-- Feb: 49 -> 352.8 -->
  <rect x="340" y="117.2" width="120" height="352.8" fill="#2c8aa8"/>
  <text x="400" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2b4c">49</text>
  <text x="400" y="498" text-anchor="middle" font-size="15" fill="#1a2b4c">February</text>

  <!-- Mar: 33 -> 237.6 -->
  <rect x="500" y="232.4" width="120" height="237.6" fill="#3ba99a"/>
  <text x="560" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2b4c">33</text>
  <text x="560" y="498" text-anchor="middle" font-size="15" fill="#1a2b4c">March</text>

  <!-- Apr: 22 -> 158.4 -->
  <rect x="660" y="311.6" width="120" height="158.4" fill="#7bbf6a"/>
  <text x="720" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2b4c">22</text>
  <text x="720" y="498" text-anchor="middle" font-size="15" fill="#1a2b4c">April*</text>

  <text x="450" y="538" text-anchor="middle" font-size="12" fill="#7a8aa3">*April reflects activity through the 9th only</text>
</svg>
