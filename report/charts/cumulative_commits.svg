<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1a2b4c">Cumulative Commits Over the Semester</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#5a6b85">Activity bursts align with major feature milestones</text>

  <!-- Plot area: x 90-860, y 110-460 -->
  <line x1="90" y1="460" x2="860" y2="460" stroke="#1a2b4c" stroke-width="2"/>
  <line x1="90" y1="110" x2="90" y2="460" stroke="#1a2b4c" stroke-width="2"/>

  <!-- Y gridlines 0..120 step 20 ; range 350 px so 1 commit = 2.92 px -->
  <g stroke="#e3e8f0" stroke-width="1">
    <line x1="90" y1="402" x2="860" y2="402"/>
    <line x1="90" y1="343" x2="860" y2="343"/>
    <line x1="90" y1="285" x2="860" y2="285"/>
    <line x1="90" y1="227" x2="860" y2="227"/>
    <line x1="90" y1="168" x2="860" y2="168"/>
    <line x1="90" y1="110" x2="860" y2="110"/>
  </g>
  <g font-size="12" fill="#5a6b85" text-anchor="end">
    <text x="84" y="464">0</text>
    <text x="84" y="406">20</text>
    <text x="84" y="347">40</text>
    <text x="84" y="289">60</text>
    <text x="84" y="231">80</text>
    <text x="84" y="172">100</text>
    <text x="84" y="114">120</text>
  </g>

  <!-- X axis: 81 days span Jan 19 (day 0) to Apr 9 (day 80), x = 90 + day*9.625 -->
  <!-- Tick marks for month boundaries -->
  <!-- Feb 1: day 13 -> x = 215; Mar 1: day 41 -> x = 484; Apr 1: day 72 -> x = 783 -->
  <g stroke="#1a2b4c" stroke-width="1">
    <line x1="215" y1="460" x2="215" y2="466"/>
    <line x1="484" y1="460" x2="484" y2="466"/>
    <line x1="783" y1="460" x2="783" y2="466"/>
  </g>
  <g font-size="13" fill="#5a6b85" text-anchor="middle">
    <text x="125" y="482">Jan</text>
    <text x="350" y="482">Feb</text>
    <text x="635" y="482">Mar</text>
    <text x="820" y="482">Apr</text>
  </g>

  <!-- Cumulative line. Data points (day, cumulative): -->
  <!-- 0, 1 ; 1, 5 ; 9, 7 ; 16, 12 ; 17, 15 ; 25, 19 ; 30, 21 ; 32, 32 ; 37, 55 ; 38, 56 ; 43, 57 ; 51, 63 ; 53, 66 ; 58, 74 ; 61, 81 ; 65, 88 ; 71, 89 ; 72, 90 ; 74, 92 ; 77, 102 ; 78, 103 ; 79, 110 ; 80, 111 -->
  <!-- y = 460 - cumulative * 2.917 -->
  <polyline fill="none" stroke="#3b6fb6" stroke-width="3" stroke-linejoin="round" points="
    90,457
    99.6,445.4
    176.6,439.6
    244.0,425.0
    253.6,416.3
    330.6,404.6
    379.4,398.7
    398.6,366.6
    446.8,299.6
    456.4,296.7
    504.5,293.8
    581.5,276.5
    600.7,267.8
    648.9,244.4
    677.7,223.9
    716.3,203.3
    773.7,200.4
    783.3,197.5
    802.6,191.7
    831.4,162.6
    841.0,159.7
    850.6,139.3
    860.2,136.3
  "/>

  <!-- Annotation: Feb 25 (day 37) - 23 commits in a day -->
  <circle cx="446.8" cy="299.6" r="5" fill="#2c8aa8"/>
  <text x="455" y="290" font-size="12" fill="#1a2b4c">Feb 25: backend + admin push</text>

  <!-- Annotation: Apr 6 (day 77) -->
  <circle cx="831.4" cy="162.6" r="5" fill="#3ba99a"/>
  <text x="825" y="152" text-anchor="end" font-size="12" fill="#1a2b4c">Apr 6: analytics polish</text>

  <text x="450" y="538" text-anchor="middle" font-size="12" fill="#7a8aa3">Cumulative commit count vs. day of project (Jan 19 – Apr 9, 2026)</text>
</svg>
