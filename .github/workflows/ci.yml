name: CI/CD

# ----------------------------------------------------------------------------
# Required GitHub repo configuration:
#
#   Variables (Settings → Secrets and variables → Actions → Variables):
#     PULUMI_STACK   — full Pulumi stack name, e.g. "your-org/dev"
#     VITE_API_URL   — backend URL the built frontend should call
#     AWS_REGION     — (optional) defaults to us-east-1
#
#   Secrets (Settings → Secrets and variables → Actions → Secrets):
#     AWS_ACCESS_KEY_ID
#     AWS_SECRET_ACCESS_KEY
#     PULUMI_ACCESS_TOKEN
# ----------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: 10xlegal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/10xlegal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server
      - run: npm test
        working-directory: server

  deploy-frontend:
    needs: [frontend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    needs: [backend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install Pulumi dependencies
        run: npm ci
        working-directory: infra

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Run pulumi up first so the ECR repo (and everything else) exists before
      # we try to push an image to it. On the very first run this will provision
      # the entire stack. The ECS service will fail-loop until the image is
      # pushed in the next step, then we force a redeploy.
      - name: Pulumi Up
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ vars.PULUMI_STACK }}
          work-dir: .
          config-map: '{"10xlegal-server:imageTag":{"value":"${{ github.sha }}"}}'

      - name: Read Pulumi stack outputs
        id: outputs
        run: |
          ECR_URL=$(pulumi stack output ecrRepositoryUrl --stack ${{ vars.PULUMI_STACK }})
          CLUSTER_NAME=$(pulumi stack output clusterName --stack ${{ vars.PULUMI_STACK }})
          SERVICE_NAME=$(pulumi stack output serviceName --stack ${{ vars.PULUMI_STACK }})
          APP_URL=$(pulumi stack output appUrl --stack ${{ vars.PULUMI_STACK }})
          echo "ecr-url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "cluster-name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "service-name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "app-url=$APP_URL" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_URL: ${{ steps.outputs.outputs.ecr-url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f server/Dockerfile -t $ECR_URL:$IMAGE_TAG .
          docker tag $ECR_URL:$IMAGE_TAG $ECR_URL:latest
          docker push $ECR_URL:$IMAGE_TAG
          docker push $ECR_URL:latest

      - name: Force ECS Service Update
        env:
          CLUSTER_NAME: ${{ steps.outputs.outputs.cluster-name }}
          SERVICE_NAME: ${{ steps.outputs.outputs.service-name }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment

      - name: Output App URL
        env:
          APP_URL: ${{ steps.outputs.outputs.app-url }}
        run: |
          echo "### Backend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App URL:** $APP_URL" >> $GITHUB_STEP_SUMMARY
